<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>XESTER VOIP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#070708;color:#fff}
header{padding:14px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;background:#070708;border-bottom:1px solid #1e1e24}
.logo{font-weight:900;line-height:.9}.logo i{color:#666;font-size:.65rem;display:block;font-style:normal;margin-top:3px}
.ticket-btn{background:#00ff88;color:#000;border:0;padding:11px 20px;border-radius:22px;font-weight:900;font-size:.9rem;cursor:pointer}
.search-row{display:flex;gap:8px;padding:12px 4%;position:sticky;top:61px;background:#070708;z-index:99}
.search-row input{flex:1;background:#151519;border:1px solid #2a2a32;color:#fff;padding:13px;border-radius:14px}
.search-row select{background:#151519;border:1px solid #2a2a32;color:#fff;padding:13px 8px;border-radius:14px;max-width:105px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 4% 90px}
.card{background:#1c1c20;border:1px solid #2a2a32;border-radius:26px;padding:18px}
.badge{background:#00ff88;color:#000;padding:6px 11px;border-radius:20px;font-size:.68rem;font-weight:900}
.pref{font-size:3.3rem;font-weight:900;margin:10px 0}
.btns{display:flex;gap:9px;margin-top:12px}.btn{flex:1;padding:14px;border-radius:14px;font-weight:900;border:0;cursor:pointer}.buy{background:#fff;color:#000}.det{background:#23232a;color:#fff;border:1px solid #3a3a44}
#ticketOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;align-items:flex-end}
#ticketOverlay.open{display:flex}
#ticketSheet{width:100%;background:#151519;border:1px solid #2a2a32;border-radius:30px 30px 0 0;padding:18px;max-height:90vh;display:flex;flex-direction:column}
#chatBox{flex:1;overflow:auto;background:#0a0a0b;border:1px solid #222;border-radius:16px;padding:12px;margin-top:12px;min-height:300px}
.msg{margin-top:10px;padding:11px 13px;border-radius:14px;max-width:86%;font-size:.92rem;word-break:break-word}
.msg-user{background:#232328;margin-left:auto}.msg-assistente{background:#122a1b;border:1px solid rgba(0,255,136,.3);color:#c2ffda}.msg-sistema{background:#1a1a1a;border:1px dashed #333;color:#888;font-size:.8rem;text-align:center;max-width:95%;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header><div class="logo">XESTER VOIP<i id="count">4205 PREFISSI</i></div><button id="openTicketBtn" class="ticket-btn">🎫 TICKET</button></header>
<div class="search-row"><input id="search" placeholder="Cerca paese..."><select id="filterCountry"><option value="all">Tutti</option></select><select id="sort"><option value="price-asc">€ basso</option></select></div>
<div class="grid" id="grid"></div>

<div id="ticketOverlay"><div id="ticketSheet">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b id="ticketId"></b><div style="color:#666;font-size:.7rem">Chat privata</div></div><div style="display:flex;gap:12px;align-items:center"><span style="color:#888;font-size:.85rem">Scade <b id="timer" style="color:#00ff88">10:00</b></span><button id="closeX" style="background:#23232a;color:#fff;border:1px solid #333;width:36px;height:36px;border-radius:50%;font-weight:900">X</button></div></div>
<div id="chatBox"></div>
<div style="display:flex;gap:8px;margin-top:12px"><input id="chatInput" placeholder="Scrivi..." style="flex:1;padding:15px;border-radius:14px;border:1px solid #333;background:#0a0a0b;color:#fff"><button id="sendBtn" style="padding:15px 22px;background:#00ff88;color:#000;border:0;border-radius:14px;font-weight:900">INVIA</button></div>
</div></div>

<script>
const BOT_TOKEN="8871567340:AAETSRfITxqdBIeqDhzy8Ib54SVu90TO3Gk";const CHAT_ID="8102746350";
function tgSend(t){fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(t)}`).catch(()=>{});}

// prodotti
const ALL=[["+234","Nigeria"],["+212","Marocco"],["+39","Italia"],["+44","UK"],["+49","Germania"],["+33","Francia"],["+1","USA"],["+91","India"]];
let products=[];for(let i=0;i<4205;i++){let p=ALL[i%ALL.length];products.push({uid:"XV-"+(10807+i),code:p[0],country:p[1],price:(0.5+Math.random()).toFixed(2),sold:Math.floor(Math.random()*600),left:Math.floor(Math.random()*8+1)})}
let sel=document.getElementById('filterCountry');[...new Set(products.map(p=>p.country))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
function render(list){let h="";list.slice(0,120).forEach(x=>{h+=`<div class="card"><div style="display:flex;justify-content:space-between"><span class="badge">VERIFICATO ✓ 5.0★</span><span style="color:#777">${x.country}</span></div><div class="pref">${x.code}</div><div style="color:#555;font-size:.72rem">ID: ${x.uid}</div><div style="margin-top:8px;font-size:1.8rem;font-weight:900">€${x.price} <span style="color:#00ff88;font-size:.9rem">-48%</span></div><div class="btns"><button class="btn buy" onclick="window.open('https://t.me/crocosupplyita?text=Ciao%20voglio%20${x.code}','_blank')">ACQUISTA</button><button class="btn det">DETTAGLI</button></div></div>`});document.getElementById('grid').innerHTML=h;}
function apply(){let q=document.getElementById('search').value.toLowerCase();let f=sel.value;render(products.filter(p=>(p.country.toLowerCase().includes(q)||p.code.includes(q))&&(f==='all'||p.country===f)));}document.getElementById('search').addEventListener('input',apply);sel.addEventListener('change',apply);render(products);

// TICKET PRIVATO PER OGNI CLIENTE
let interval=null,timeout=null,remaining=600,ticketId=null,lastUpdateId=0,poll=null;
const STORAGE_KEY="xester_current_ticket";

function getTicketData(id){try{let d=localStorage.getItem('ticket_'+id);return d?JSON.parse(d):null}catch(e){return null}}
function saveTicket(){
  if(!ticketId) return;
  try{
    let data={id:ticketId,remaining:remaining,html:document.getElementById('chatBox').innerHTML,lastUpdateId:lastUpdateId,time:Date.now()};
    localStorage.setItem('ticket_'+ticketId,JSON.stringify(data));
    localStorage.setItem(STORAGE_KEY,ticketId);
  }catch(e){}
}
function loadCurrentTicket(){
  try{
    let curId=localStorage.getItem(STORAGE_KEY);
    if(!curId) return null;
    let data=getTicketData(curId);
    if(!data) return null;
    let passed=Math.floor((Date.now()-data.time)/1000);
    data.remaining=Math.max(0,data.remaining-passed);
    if(data.remaining<=0){localStorage.removeItem('ticket_'+curId);localStorage.removeItem(STORAGE_KEY);return null;}
    return data;
  }catch(e){return null}
}
function addMsg(who,text,cls){let b=document.getElementById('chatBox');let d=document.createElement('div');d.className='msg msg-'+cls;d.innerHTML=`<b>${who}</b><br>${text}`;b.appendChild(d);b.scrollTop=b.scrollHeight;saveTicket();}
function startTimer(){
  clearInterval(interval);clearTimeout(timeout);
  interval=setInterval(()=>{
    remaining--;
    let m=Math.floor(remaining/60),s=remaining%60;
    document.getElementById('timer').innerText=`${m}:${String(s).padStart(2,'0')}`;
    if(remaining<=0){
      tgSend(`❌ Ticket ${ticketId} cancellato per scadenza (10 min)`);
      addMsg("Sistema",`Ticket ${ticketId} scaduto e cancellato.`, "sistema");
      setTimeout(()=>{localStorage.removeItem('ticket_'+ticketId);localStorage.removeItem(STORAGE_KEY);closeTicket(true);},1200);
      clearInterval(interval);
    }
    saveTicket();
  },1000);
  timeout=setTimeout(()=>{localStorage.removeItem('ticket_'+ticketId);localStorage.removeItem(STORAGE_KEY);closeTicket(true);},remaining*1000);
}
function startPolling(){
  clearInterval(poll);
  poll=setInterval(async()=>{
    try{
      let res=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId+1}&timeout=1`);
      let data=await res.json();
      if(!data.result) return;
      for(let u of data.result){
        lastUpdateId=u.update_id;
        if(u.message && String(u.message.chat.id)===String(CHAT_ID) && u.message.text){
          let txt=u.message.text.trim();
          if(txt.startsWith('/')||txt.includes('NUOVO TICKET')||txt.includes('Cliente:')||txt.includes('cancellato per scadenza')) continue;
          // risposta tua -> cliente
          addMsg("Assistente",txt,"assistente");
        }
      }
      saveTicket();
    }catch(e){}
  },2000);
}
function closeTicket(force){
  document.getElementById('ticketOverlay').classList.remove('open');
  clearInterval(interval);clearTimeout(timeout);clearInterval(poll);
  if(force){
    if(ticketId){localStorage.removeItem('ticket_'+ticketId);}
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('chatBox').innerHTML="";
    ticketId=null;remaining=600;
  }else{
    // chiudi con X: salva tutto, timer continua in background tramite timestamp
    saveTicket();
  }
}
function openTicket(){
  let saved=loadCurrentTicket();
  if(saved){
    ticketId=saved.id;remaining=saved.remaining;lastUpdateId=saved.lastUpdateId||0;
    document.getElementById('ticketId').innerText=ticketId;
    document.getElementById('chatBox').innerHTML=saved.html;
  }else{
    ticketId="XV-TICKET-"+Math.floor(Math.random()*90000+10000);
    remaining=600;lastUpdateId=0;
    document.getElementById('ticketId').innerText=ticketId;
    document.getElementById('chatBox').innerHTML="";
    addMsg("Sistema",`Ticket ${ticketId} aperto. Chat privata. Se chiudi con X e riapri, ritrovi tutto e il timer continua. Dopo 10 min si cancella.`, "sistema");
    tgSend(`🎫 NUOVO TICKET ${ticketId}\nCliente ha aperto ticket. Rispondi qui.`);
  }
  document.getElementById('ticketOverlay').classList.add('open');
  startTimer();startPolling();saveTicket();
}

document.getElementById('openTicketBtn').onclick=openTicket;
document.getElementById('closeX').onclick=()=>closeTicket(false);
document.getElementById('ticketOverlay').addEventListener('click',e=>{if(e.target.id==='ticketOverlay')closeTicket(false);});
document.getElementById('sendBtn').onclick=()=>{
  let i=document.getElementById('chatInput');let t=i.value.trim();if(!t||!ticketId)return;
  addMsg("Tu",t,"user");tgSend(`🎫 ${ticketId}\n👤 Cliente: ${t}`);i.value="";
};
document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('sendBtn').click();});
</script>
</body>
</html>
