<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#070708;color:#fff;overflow-x:hidden}

header{padding:18px 5%;border-bottom:1px solid #1c1c20;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(7,7,8,0.92);backdrop-filter:blur(12px);z-index:50}
.logo{font-weight:900;letter-spacing:-1px;font-size:1.3rem}

.price{font-size:1.9rem;font-weight:900}
.oldPrice{color:#555;text-decoration:line-through;font-size:.9rem}

let products=[];
for(let i=0;i<4205;i++){

countries.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});

function render(list){
  let html="";
  for(let x of list){
    html+=`<div class="card">
      <div class="cardHead"><span class="badge">VERIFICATO ✓ ${x.rating}★</span><span class="country">${x.country}</span></div>
      <div class="pref">${x.code}</div>
      <div class="meta">ID: XV-${10000+x.id} • ${x.sales} venduti • ${x.stock} rimasti<br>Prefisso Internazionale - Attivazione Istantanea - Garanzia 30gg</div>
      <div class="priceRow"><div><div class="oldPrice">€${x.oldPrice}</div><div class="price">€${x.price}</div></div><div style="color:#00ff88;font-size:.8rem;font-weight:800">-48% OGGI</div></div>
      <div class="btns"><button class="btn buy" onclick="buyNow('${x.code}','${x.country}','${x.price}')">ACQUISTA</button><button class="btn det" onclick="openDet(${x.id})">DETTAGLI PRODOTTO</button></div>
    </div>`;
  }
  document.getElementById('grid').innerHTML=html;
  document.getElementById('count').innerText=list.length;
}

function openDet(id){
  let o=products.find(p=>p.id===id);
  document.getElementById('mTitle').innerText=`Prefisso ${o.code} - ${o.country}`;
  document.getElementById('mSub').innerText=`ID: XV-${10000+o.id} • €${o.price} • ${o.stock} pezzi rimasti • ${o.sales} venduti • Rating ${o.rating}/5`;
  document.getElementById('mTags').innerHTML=`<span class="tag">SMS Illimitati</span><span class="tag">Chiamate Vocali</span><span class="tag">WhatsApp OK</span><span class="tag">Telegram OK</span><span class="tag">Garanzia 10min</span><span class="tag">IP ${o.country}</span><span class="tag">30 Giorni</span>`;
  document.getElementById('mText').innerText=buildVeryLongDetails(o);
  document.getElementById('modal').style.display='flex';
}

function buyNow(code,country,price){
  alert(`Hai scelto: Prefisso ${code} ${country} - €${price}\n\nVerrai reindirizzato al checkout XesterVoip.\n(Collega qui il tuo link Telegram/WhatsApp/PayPal)`);
}

function applyFilters(){
  let q=document.getElementById('search').value.toLowerCase();
  let fc=document.getElementById('filterCountry').value;
  let sort=document.getElementById('sort').value;
  let filtered=products.filter(p=>{
    let matchSearch = p.country.toLowerCase().includes(q) || p.code.includes(q);
    let matchCountry = fc==='all' || p.country===fc;
    return matchSearch && matchCountry;
  });
  if(sort==='price-asc') filtered.sort((a,b)=>parseFloat(a.price)-parseFloat(b.price));
  if(sort==='price-desc') filtered.sort((a,b)=>parseFloat(b.price)-parseFloat(a.price));
  if(sort==='country') filtered.sort((a,b)=>a.country.localeCompare(b.country));
  if(sort==='prefix') filtered.sort((a,b)=>a.code.localeCompare(b.code));
  render(filtered);
}

document.getElementById('search').addEventListener('input',applyFilters);
document.getElementById('sort').addEventListener('change',applyFilters);
document.getElementById('filterCountry').addEventListener('change',applyFilters);

render(products);
</script>
