<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>XESTER VOIP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#070708;color:#fff;overflow-x:hidden}
#welcome{position:fixed;inset:0;background:#fff;color:#000;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center}
#welcome h1{font-size:4.5rem;font-weight:900;letter-spacing:-3px;line-height:.9}
#welcome p{letter-spacing:8px;color:#666;font-weight:800;margin-top:8px;font-size:.8rem}
#welcomeCount{font-size:6rem;font-weight:900;margin-top:15px;color:#000}
#welcomeBar{width:200px;height:4px;background:#eee;border-radius:10px;margin-top:20px;overflow:hidden}
#welcomeBarInner{height:100%;width:0%;background:#00ff88;transition:width.1s linear}
header{padding:14px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;background:#070708;border-bottom:1px solid #1e1e24}
.logo{font-weight:900;line-height:.9}.logo i{color:#666;font-size:.65rem;display:block;font-style:normal;margin-top:3px;letter-spacing:1px}
.ticket-btn{background:#00ff88;color:#000;border:0;padding:11px 20px;border-radius:22px;font-weight:900;font-size:.9rem;cursor:pointer;box-shadow:0 0 18px rgba(0,255,136,.4)}
.search-row{display:flex;gap:8px;padding:12px 4%;position:sticky;top:61px;background:#070708;z-index:99}
.search-row input{flex:1;background:#151519;border:1px solid #2a2a32;color:#fff;padding:13px;border-radius:14px}
.search-row select{background:#151519;border:1px solid #2a2a32;color:#fff;padding:13px 8px;border-radius:14px;max-width:105px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 4% 90px}
.card{background:#1c1c20;border:1px solid #2a2a32;border-radius:26px;padding:18px}
.badge{background:#00ff88;color:#000;padding:6px 11px;border-radius:20px;font-size:.68rem;font-weight:900}
.pref{font-size:3.3rem;font-weight:900;margin:10px 0;letter-spacing:-2px}
.btns{display:flex;gap:9px;margin-top:12px}.btn{flex:1;padding:14px;border-radius:14px;font-weight:900;border:0;cursor:pointer;font-size:.85rem}.buy{background:#fff;color:#000}.det{background:#23232a;color:#fff;border:1px solid #3a3a44}
#ticketOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;align-items:flex-end}
#ticketOverlay.open{display:flex}
#ticketSheet{width:100%;background:#151519;border:1px solid #2a2a32;border-top-left-radius:30px;border-top-right-radius:30px;padding:18px;max-height:90vh;display:flex;flex-direction:column}
#detailsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99998;align-items:flex-end}
#detailsOverlay.open{display:flex}
#detailsSheet{width:100%;background:#151519;border:1px solid #2a2a32;border-top-left-radius:30px;border-top-right-radius:30px;padding:22px;max-height:88vh;overflow:auto}
#chatBox{flex:1;overflow:auto;background:#0a0a0b;border:1px solid #222;border-radius:16px;padding:12px;margin-top:12px;min-height:300px}
.msg{margin-top:10px;padding:11px 13px;border-radius:14px;max-width:86%;font-size:.92rem;word-break:break-word}
.msg-user{background:#232328;margin-left:auto}.msg-assistente{background:#122a1b;border:1px solid rgba(0,255,136,.3);color:#c2ffda}.msg-moderazione{background:#1a1f3d;border:1px solid #4a6cff;color:#c2d2ff}.msg-sistema{background:#1a1a1a;border:1px dashed #333;color:#888;font-size:.8rem;text-align:center;max-width:95%;margin:0 auto}
</style>
</head>
<body>

<div id="welcome">
<h1>BENVENUTO</h1>
<p>XESTER VOIP</p>
<div id="welcomeCount">0</div>
<div id="welcomeBar"><div id="welcomeBarInner"></div></div>
</div>

<header>
<div class="logo">XESTER VOIP<i id="count">4205 PREFISSI</i></div>
<button id="openTicketBtn" class="ticket-btn">🎫 TICKET</button>
</header>

<div class="search-row">
<input id="search" placeholder="Cerca paese, prefisso...">
<select id="filterCountry"><option value="all">Tutti</option></select>
<select id="sort"><option value="price-asc">€ basso</option></select>
</div>

<div class="grid" id="grid"></div>

<div id="detailsOverlay"><div id="detailsSheet">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
<b style="font-size:1.3rem">DETTAGLI PRODOTTO</b>
<button id="closeDetails" style="background:#23232a;color:#fff;border:1px solid #333;width:36px;height:36px;border-radius:50%;font-weight:900">X</button>
</div>
<div id="detailsContent"></div>
</div></div>

<div id="ticketOverlay"><div id="ticketSheet">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b id="ticketId"></b><div style="color:#666;font-size:.7rem">Chat privata</div></div><div style="display:flex;gap:12px;align-items:center"><span style="color:#888;font-size:.85rem">Scade <b id="timer" style="color:#00ff88">10:00</b></span><button id="closeX" style="background:#23232a;color:#fff;border:1px solid #333;width:36px;height:36px;border-radius:50%;font-weight:900">X</button></div></div>
<div id="chatBox"></div>
<div style="display:flex;gap:8px;margin-top:12px"><input id="chatInput" placeholder="Scrivi..." style="flex:1;padding:15px;border-radius:14px;border:1px solid #333;background:#0a0a0b;color:#fff"><button id="sendBtn" style="padding:15px 22px;background:#00ff88;color:#000;border:0;border-radius:14px;font-weight:900">INVIA</button></div>
</div></div>

<script src="script.js"></script>
<script>
let countEl=document.getElementById('welcomeCount');
let barEl=document.getElementById('welcomeBarInner');
let welcomeEl=document.getElementById('welcome');
let c=0;
let loader=setInterval(()=>{
  c+=5;
  if(c>250) c=250;
  countEl.innerText=c;
  barEl.style.width=(c/250*100)+"%";
  if(c>=250){
    clearInterval(loader);
    setTimeout(()=>{
      welcomeEl.style.transition="all.6s ease";
      welcomeEl.style.opacity="0";
      welcomeEl.style.transform="translateY(-20px)";
      setTimeout(()=>{welcomeEl.style.display="none";},600);
    },400);
  }
},18);
</script>
</body>
</html>
